name: Build Skyline

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CMAKE_VERSION: "3.22.1"
      NDK_VERSION: "25.0.8775105"

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Ensure submodules complete
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Set up JDK (Temurin 11)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Install CMake & Android NDK (exact versions)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;${CMAKE_VERSION}" "ndk;${NDK_VERSION}" > /dev/null

      - name: Android Assemble (full/release)
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}"
        run: |
          chmod +x gradlew
          ./gradlew --stacktrace --build-cache --parallel assembleFullRelease

      - name: Rename APK
        run: mv app/build/outputs/apk/full/release/app-full-release.apk "skyline-$GITHUB_RUN_NUMBER-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: skyline-${{ github.run_number }}-release-apk
          path: skyline-*-release.apk
          if-no-files-found: error
